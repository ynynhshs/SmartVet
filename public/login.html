<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SmartVet</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/login.css">
    <script src="/js/session.js" defer></script>
    <script src="/js/login.js" defer></script>
</head>
<body class="login-body">
    <main class="login-wrapper">
        <div class="login-card">

            <section class="login-form-side">
                <div class="brand-pill">
                    <span class="brand-pill-text">🐾 SmartVet</span>
                </div>

                <!-- Existing login view -->
                <div id="loginView">
                    <div class="form-header">
                        <h1>Sign in</h1>
                        <p>Welcome back! Please enter your details.</p>
                    </div>

                    <form id="loginForm">
                        <div class="form-field">
                            <label for="email">Email</label>
                            <input
                                id="email"
                                name="email"
                                type="email"
                                placeholder="Enter your email"
                                autocomplete="username"
                                required
                            >
                        </div>

                        <div class="form-field">
                            <label for="password">Password</label>
                            <div class="password-field">
                                <input
                                    id="password"
                                    name="password"
                                    type="password"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required
                                >
                                <button
                                    type="button"
                                    class="password-toggle"
                                    data-target="password"
                                    aria-label="Show password"
                                    aria-pressed="false"
                                >
                                    <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                    <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                                </button>
                            </div>
                        </div>

                        <button
                            class="primary-button submit-btn"
                            id="loginButton"
                            type="submit"
                        >
                            Sign in
                        </button>

                        <p
                            id="loginMessage"
                            class="form-message"
                            role="status"
                            aria-live="polite"
                        ></p>
                    </form>

                    <div class="form-footer">
                        <p>New pet owner?
                            <button
                                class="text-button"
                                id="showRegisterButton"
                                type="button"
                            >Create an owner account</button>
                        </p>
                        <p>Back to <a class="back-link" href="/">SmartVet Home</a></p>
                    </div>
                </div>

                <!-- New owner registration view -->
                <div id="registerView" hidden>
                    <form id="registerForm" enctype="multipart/form-data">
                    <div class="register-top">
                        <div class="profile-photo-upload-container">
                            <div
                                class="avatar-preview-circle"
                                id="registerAvatarPreview"
                                role="button"
                                tabindex="0"
                                aria-label="Upload or change profile photo"
                                title="Upload profile photo"
                            >
                                <span id="registerAvatarInitials">🐾</span>
                                <img id="registerAvatarImage" alt="Selected profile photo preview" hidden>
                                <span class="avatar-camera-badge" aria-hidden="true">📷</span>
                            </div>
                            <label for="registerProfilePhoto" class="photo-upload-label">
                                Upload photo
                            </label>
                            <input
                                type="file"
                                id="registerProfilePhoto"
                                name="profilePhoto"
                                accept="image/jpeg, image/png, image/webp"
                                hidden
                            >
                        </div>

                        <div class="form-header">
                            <h1>Create account</h1>
                            <p>Register your owner account to manage your pets.</p>
                            <p class="form-header-note"><span class="req">*</span> Required fields</p>
                        </div>
                    </div>

                        <div class="form-section-title">
                            <span class="step-badge">1</span>Personal details
                        </div>

                        <div class="form-field">
                            <label for="registerFullName">Full name <span class="req">*</span></label>
                            <input id="registerFullName" name="fullName" type="text" placeholder="e.g. Juan Dela Cruz" autocomplete="name" minlength="2" maxlength="120" required>
                        </div>

                        <div class="form-grid-2">
                            <div class="form-field">
                                <label for="registerDob">Date of birth</label>
                                <input id="registerDob" name="dateOfBirth" type="date">
                            </div>
                            <div class="form-field">
                                <label for="registerGender">Sex / Gender</label>
                                <select id="registerGender" name="gender">
                                    <option value="">Select...</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                    <option value="Prefer not to say">Prefer not to say</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-grid-2">
                            <div class="form-field">
                                <label for="registerCivilStatus">Civil / Marital Status</label>
                                <select id="registerCivilStatus" name="civilStatus">
                                    <option value="">Select...</option>
                                    <option value="Single">Single</option>
                                    <option value="Married">Married</option>
                                    <option value="Widowed">Widowed</option>
                                    <option value="Separated">Separated</option>
                                </select>
                            </div>
                            <div class="form-field">
                                <label for="registerNationality">Nationality / Citizenship</label>
                                <input id="registerNationality" name="nationality" type="text" placeholder="e.g. Filipino" maxlength="100">
                            </div>
                        </div>

                        <div class="form-grid-2">
                            <div class="form-field">
                                <label for="registerGovId">Government / ID Number</label>
                                <input id="registerGovId" name="govId" type="text" placeholder="PhilSys / TIN / Driver's License" maxlength="100">
                            </div>
                            <div class="form-field">
                                <label for="registerOccupation">Occupation / Student Status</label>
                                <select id="registerOccupation" name="occupation">
                                    <option value="">Select...</option>
                                    <option value="Employed">Employed</option>
                                    <option value="Self-Employed">Self-Employed</option>
                                    <option value="Student">Student</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-section-title">
                            <span class="step-badge">2</span>Contact &amp; address
                        </div>

                        <div class="form-grid-2">
                            <div class="form-field">
                                <label for="registerEmail">Email <span class="req">*</span></label>
                                <input id="registerEmail" name="email" type="email" placeholder="juan.delacruz@example.com" autocomplete="email" maxlength="254" required>
                            </div>

                            <div class="form-field">
                                <label for="registerPhone">Mobile number</label>
                                <input id="registerPhone" name="phone" type="tel" placeholder="+63 9XX XXX XXXX" autocomplete="tel" maxlength="30">
                            </div>
                        </div>

                        <div class="form-field">
                            <label for="registerAddress">Current address</label>
                            <input id="registerAddress" name="address" type="text" placeholder="House/Unit No., Street, Barangay, City/Municipality, Province" autocomplete="street-address" maxlength="250">
                        </div>

                        <div class="form-field">
                            <label for="registerPermanentAddress">Permanent Address</label>
                            <input id="registerPermanentAddress" name="permanentAddress" type="text" placeholder="Same as above / [Specify address]" maxlength="250">
                        </div>

                        <div class="form-section-title">
                            <span class="step-badge">3</span>Account security
                        </div>

                        <div class="form-grid-2">
                            <div class="form-field">
                                <label for="registerPassword">Password <span class="req">*</span></label>
                                <div class="password-field">
                                    <input id="registerPassword" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
                                    <button
                                        type="button"
                                        class="password-toggle"
                                        data-target="registerPassword"
                                        aria-label="Show password"
                                        aria-pressed="false"
                                    >
                                        <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                        <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                                    </button>
                                </div>
                            </div>

                            <div class="form-field">
                                <label for="confirmPassword">Confirm password <span class="req">*</span></label>
                                <div class="password-field">
                                    <input id="confirmPassword" name="confirmPassword" type="password" placeholder="Re-enter your password" autocomplete="new-password" minlength="8" required>
                                    <button
                                        type="button"
                                        class="password-toggle"
                                        data-target="confirmPassword"
                                        aria-label="Show confirm password"
                                        aria-pressed="false"
                                    >
                                        <svg class="icon-show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                        <svg class="icon-hide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <button class="primary-button submit-btn" id="registerButton" type="submit">
                            Create owner account
                        </button>

                        <p id="registerMessage" class="form-message" role="status" aria-live="polite"></p>
                    </form>

                    <div class="form-footer">
                        <p>Already registered?
                            <button
                                class="text-button"
                                id="showLoginButton"
                                type="button"
                            >Sign in</button>
                        </p>
                        <p>Back to <a class="back-link" href="/">SmartVet Home</a></p>
                    </div>
                </div>
            </section>

            <!-- Keep the existing hero image and two-column design -->
            <section class="login-hero-side">
                <div class="hero-image-wrapper">
                    <img
                        src="/images/VetCare.jpg"
                        alt="SmartVet veterinary care"
                        class="dog-hero-img"
                    >
                </div>
            </section>

        </div>
    </main>
</body>
</html>
